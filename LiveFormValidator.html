<!doctype html>
<html>
  <body>
    <h3>User Registration Check</h3>
    <input
      type="text"
      id="username"
      placeholder="Username (min 3 chars)"
      oninput="validate()"
    /><br /><br />
    <input
      type="text"
      id="email"
      placeholder="Email (must have @)"
      oninput="validate()"
    /><br /><br />

    <button id="submitBtn" disabled>Submit</button>
    <p id="msg" style="color: red"></p>

    <script>
      function validate() {
        const u = document.getElementById("username").value.trim();
        const e = document.getElementById("email").value.trim();

        // Array of condition checks
        const checks = [
          { label: "Username too short", invalid: u.length < 3 },
          { label: "Missing valid email (@)", invalid: !e.includes("@") },
        ];

        // some(): check if AT LEAST ONE check failed
        const hasErrors = checks.some((c) => c.invalid);

        // find(): get the first failing rule to show error message
        const firstError = checks.find((c) => c.invalid);

        document.getElementById("submitBtn").disabled = hasErrors;
        document.getElementById("msg").innerText = hasErrors
          ? firstError.label
          : "";
      }
    </script>
  </body>
</html>
