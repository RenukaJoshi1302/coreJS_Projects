<!doctype html>
<html lang="en">
  <body>
    <h2>Smart Task Tracker</h2>
    <input type="text" id="taskText" placeholder="Enter task name..." />
    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>
    <p id="statsDisplay"></p>

    <script>
      // 1. STATE: Array of Objects
      let tasks = [
        { id: 1, text: "Learn Array Methods", done: false },
        { id: 2, text: "Practice Reduce", done: true },
      ];

      // 2. ADD: Parameters, Strings & Array Push
      function addTask() {
        const input = document.getElementById("taskText");
        const cleanText = input.value.trim(); // String method
        if (!cleanText) return; // Guard clause

        tasks.push({ id: Date.now(), text: cleanText, done: false });
        input.value = "";
        render();
      }

      // 3. TOGGLE: Array.find()
      function toggleTask(id) {
        const task = tasks.find((t) => t.id === id); // Find matching object
        if (task) task.done = !task.done; // Flip boolean
        render();
      }

      // 4. DELETE: Array.filter()
      function deleteTask(id) {
        tasks = tasks.filter((t) => t.id !== id); // Keep all except the clicked one
        render();
      }

      // 5. RENDER & STATS: map(), reduce(), every()
      function render() {
        const list = document.getElementById("taskList");
        const stats = document.getElementById("statsDisplay");

        // map(): Transform array of objects into array of HTML strings
        list.innerHTML = tasks
          .map(
            (t) => `
        <li>
          <span style="text-decoration: ${t.done ? "line-through" : "none"}">${t.text}</span>
          <button onclick="toggleTask(${t.id})">${t.done ? "Undo" : "Done"}</button>
          <button onclick="deleteTask(${t.id})">Delete</button>
        </li>
      `,
          )
          .join("");

        // reduce(): Count completed items
        const completedCount = tasks.reduce(
          (sum, t) => (t.done ? sum + 1 : sum),
          0,
        );

        // every(): Returns true ONLY if all items are done
        const allFinished = tasks.length > 0 && tasks.every((t) => t.done);

        stats.innerHTML = `Completed: ${completedCount} / ${tasks.length} | All done? <strong>${allFinished ? "Yes!" : "No"}</strong>`;
      }

      render(); // Initial draw
    </script>
  </body>
</html>
